name: Release

# Build the macOS artifacts — a signed (ad-hoc) .app wrapped in a DMG,
# and the CLI as a tarball — with a SHA-256 file beside each, and
# attach them to a GitHub Release whenever a `v*` tag is pushed.
#
# Trigger flow:
#   1. git tag v0.1.0  (locally)
#   2. git push origin v0.1.0
#   3. GitHub Actions picks up the push, builds, publishes the Release.
#
# The workflow only fires on tag pushes — never on branch pushes or
# PRs — so feature branches can't accidentally create releases.

on:
  push:
    tags:
      - 'v*'

# The release step writes a Release object and uploads an asset, so
# the GITHUB_TOKEN needs write access to repo contents. Everything
# else stays read-only.
permissions:
  contents: write

# One release run per tag at a time. Two runs racing the same tag — a
# rerun started while the first is still publishing, or a tag deleted
# and re-pushed — would contend for the same release object and the
# same asset names, producing duplicate-upload failures or a release
# assembled from two different builds.
#
# cancel-in-progress is deliberately false: cancelling a run that is
# midway through uploading assets is how you get the half-populated
# release this workflow now works to avoid. Queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build macOS assets and publish release
    # macos-15 = Apple Silicon w/ Xcode 16 (Swift 6.x). macos-14 ships
    # Swift 5.9 which can't compile swift-argument-parser 1.7.0+
    # (Swift-6-only feature). The produced app's deployment target
    # stays macOS 14 — that's controlled by Package.swift, not the
    # build host.
    runs-on: macos-15

    steps:
      - name: Validate the tag is a release version
        # `on.push.tags: v*` also matches `v`, `vfoo`, and names with a
        # slash. Everything downstream strips one leading `v` and feeds
        # the rest into plist versions and asset filenames, so a
        # malformed tag either fails deep in the build or publishes
        # assets nobody can name. Fail here instead, before anything is
        # built and long before a release object exists.
        #
        # GITHUB_REF_NAME goes through the environment rather than a
        # `${{ }}` expression: a tag name is attacker-controllable by
        # anyone who can push one, and interpolating it directly into a
        # run block is a script-injection sink.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "ERROR: tag '$TAG' is not a release version (expected vMAJOR.MINOR.PATCH[-prerelease])" >&2
              exit 1
          fi
          echo "Tag $TAG accepted"

      - name: Checkout
        # Pinned by full commit SHA per code-standards.md (no `@v6`
        # floating reference). Update by bumping both the SHA and the
        # trailing comment when a new release ships.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history + tags. The release-notes step below runs
          # `git describe --tags HEAD^` to find the previous tag, which
          # silently finds nothing under the default depth-1 checkout —
          # so `--notes-start-tag` was being omitted and notes generated
          # from the wrong range on every release after the first.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build .app, DMG, CLI tarball and checksums
        run: |
          # GITHUB_REF_NAME is "v0.1.0" for a `v*` tag push; strip the
          # leading `v` so the bundle version matches semver convention.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          ./scripts/build-app.sh "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Every asset build-app.sh produces. Each is checked before
          # the upload rather than after: `gh release create` with a
          # missing path publishes the release and then fails, leaving
          # a half-populated release that a rerun cannot recreate.
          ASSETS=(
              "build/release/MiniDumpTruck-${VERSION}-arm64.dmg"
              "build/release/MiniDumpTruck-${VERSION}-arm64.dmg.sha256"
              "build/release/minidumptruck-cli-${VERSION}-macos-arm64.tar.gz"
              "build/release/minidumptruck-cli-${VERSION}-macos-arm64.tar.gz.sha256"
          )
          for asset in "${ASSETS[@]}"; do
              if [[ ! -f "$asset" ]]; then
                  echo "ERROR: expected $asset to exist after build step" >&2
                  exit 1
              fi
          done
          # `--generate-notes` pulls the auto-generated changelog from
          # merged PR titles between this tag and the previous one.
          # On the FIRST release there is no previous tag, so we
          # conditionally include `--notes-start-tag` — passing an
          # empty value is malformed for `gh release create`.
          ARGS=(--title "$GITHUB_REF_NAME" --generate-notes)
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
              ARGS+=(--notes-start-tag "$PREV_TAG")
          fi

          # Created as a DRAFT, and published only by the last step of
          # the Linux job once all six assets are attached.
          #
          # Before this, `gh release create` published and uploaded in
          # one non-atomic call: any upload, network, or runner failure
          # after creation left a PUBLIC release missing assets, and a
          # rerun then failed because the release already existed. A
          # draft is invisible to watchers, webhooks, and the "latest
          # release" endpoint until it is published, so a failed run now
          # leaves something incomplete-but-private rather than
          # incomplete-and-announced.
          #
          # The create/upload split makes a rerun work rather than fail:
          # a first run creates the draft, a rerun finds it and clobbers
          # the assets in place. `gh release view` is the existence test
          # because it succeeds for drafts too, which `gh release list`
          # does not reliably do.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists — re-uploading macOS assets"
              gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
              gh release create "$GITHUB_REF_NAME" --draft "${ARGS[@]}" "${ASSETS[@]}"
          fi

  release-linux:
    name: Build Linux CLI and attach to release
    # Runs after the macOS job rather than beside it: that job is what
    # creates the Release object, and this one uploads into it. In
    # parallel the upload could reach GitHub before the release exists.
    #
    # The consequence of that ordering is worth knowing: if this job
    # fails, the release still exists with the DMG attached and no Linux
    # asset, rather than not existing at all. Re-running this job alone
    # is enough to add the missing asset.
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Same pin as the job above and as both CI jobs — bump them
        # together.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build the CLI in the pinned Swift image
        # The same swift:6.1-noble image the Linux CI job pins, driven
        # through `docker run` instead of the job-level `container:` key.
        # That image ships no gh, curl or jq, so a job running entirely
        # inside it could build this artifact but had no way to attach it
        # to the release. Splitting the difference — toolchain in the
        # image, publish on the host where GitHub preinstalls gh — keeps
        # the build reproducible against the pinned toolchain without
        # adding a third-party action to pin and track.
        #
        # --static-swift-stdlib links the Swift runtime into the binary so
        # the download does not require a matching Swift toolchain. It
        # does NOT produce a fully static binary; see the packaging step.
        run: |
          # Pinned by DIGEST, not by the `6.1-noble` tag. A tag is
          # mutable: whoever controls it can retarget it, and this job
          # would then build a different binary and publish a matching
          # checksum for it — the checksum attests to whatever came out
          # of the image, so it cannot detect this. The repo already
          # pins GitHub Actions by commit SHA for exactly this reason;
          # the base image was the inconsistent one.
          #
          # This is the multi-arch index digest, so it resolves on both
          # amd64 and arm64. Bump it deliberately when moving Swift
          # versions, and bump ci.yml's copy in the same commit.
          docker run --rm -v "$PWD:/src" -w /src/App \
              swift@sha256:fddaf02db3d41844916167ef4d199d5ca14c6003d052a0b9ab579646a9c720ec \
              swift build -c release --static-swift-stdlib --product minidumptruck-cli

      - name: Package tarball and checksum
        # ubuntu-latest runners are x86_64, so the architecture in the
        # asset name is a statement about this runner. It is spelled out
        # rather than left implied because the macOS asset beside it is
        # arm64, and a bare "linux" name would not say which.
        #
        # The binary comes out of the container owned by root; `install`
        # copies it into a staging dir with normal ownership and an
        # explicit mode, so the tarball does not carry root ownership or
        # a surprising permission bit to whoever extracts it.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN=App/.build/release/minidumptruck-cli
          if [[ ! -x "$BIN" ]]; then
              echo "ERROR: expected $BIN to exist after the build step" >&2
              exit 1
          fi

          ARCHIVE="minidumptruck-cli-${VERSION}-linux-x86_64.tar.gz"
          mkdir -p stage
          install -m 0755 "$BIN" stage/minidumptruck-cli
          tar -czf "$ARCHIVE" -C stage minidumptruck-cli
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

          # Recorded in the log next to the checksum so the runtime
          # dependency is visible to anyone auditing a published asset,
          # not only to readers of CLI.md.
          echo "Runtime dependency: libcurl4 (everything else this binary needs ships in a base Ubuntu image)."

          # The upload step needs this name too; recomputing the version
          # string there invites the two copies to drift.
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber makes this step re-runnable. Without it, a run where
        # the archive uploaded and the checksum did not left the release
        # holding a binary nobody could verify, and rerunning failed on
        # the duplicate archive BEFORE it reached the missing checksum —
        # so the one recovery action available made no progress.
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

      - name: Publish the release
        # The last step of the last job, and the only one that makes the
        # release public. Everything above assembles a draft; if any of
        # it fails, the draft stays a draft and nobody sees a release
        # missing half its assets.
        #
        # Re-running this on an already-published release is a no-op
        # rather than an error, so a partial rerun cannot get stuck here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "Published $GITHUB_REF_NAME with all assets attached."
